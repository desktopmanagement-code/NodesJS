<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gemeinde-Anfragen Dispatcher</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <h1>Gemeinde: Anfrage-Routing + Erstantwort</h1>

    <section class="panel">
      <h2>Anfrage analysieren</h2>
      <label for="provider">LLM auswählen</label>
      <select id="provider">
        <option value="rule-based">Regelbasiert (lokal)</option>
        <option value="openai">OpenAI (konfigurierbar)</option>
      </select>

      <label for="emailText">Bürgeranfrage</label>
      <textarea id="emailText" rows="8" placeholder="z.B. Wann hat das Bürgerbüro geöffnet? Oder: Antwort auf ein Schreiben..."></textarea>
      <button id="analyzeBtn">Analysieren & Antwort erzeugen</button>
    </section>

    <section id="resultSection" class="panel hidden">
      <h2>Ergebnis</h2>
      <p><strong>Modell/Modus:</strong> <span id="modelNotice"></span></p>
      <div class="result-grid">
        <div>
          <label>Zielgruppe (Vorschlag)</label>
          <input id="groupOutput" readonly />
        </div>
        <div>
          <label>Korrektur Zielgruppe</label>
          <input id="groupCorrection" placeholder="z.B. Bauamt" />
        </div>
        <div>
          <label>Erstantwort (Vorschlag)</label>
          <textarea id="responseOutput" rows="8" readonly></textarea>
        </div>
        <div>
          <label>Korrektur Antworttext</label>
          <textarea id="responseCorrection" rows="8" placeholder="Verbesserte Antwort..."></textarea>
        </div>
      </div>
      <div class="result-grid single-row">
        <div>
          <label>Bewertung</label>
          <select id="rating">
            <option value="passt-sehr-gut">Passt sehr gut</option>
            <option value="weitgehend-passend">Weitgehend passend</option>
            <option value="teilweise-passend">Teilweise passend</option>
            <option value="passt-gar-nicht">Passt gar nicht</option>
          </select>
        </div>
        <div>
          <label>Kommentar</label>
          <input id="note" />
        </div>
      </div>
      <button id="saveFeedbackBtn">Feedback speichern</button>
      <p id="status"></p>
    </section>

    <section class="panel">
      <h2>Routing-Gruppen verwalten</h2>
      <p id="groupsList"></p>
      <label for="groupName">Neue Gruppe</label>
      <input id="groupName" placeholder="z.B. Standesamt" />
      <label for="groupKeywords">Schlüsselwörter (kommagetrennt)</label>
      <input id="groupKeywords" placeholder="z.B. heirat, urkunde, geburt" />
      <button id="addGroupBtn">Gruppe speichern</button>
    </section>

    <section class="panel">
      <h2>KI-Prompts & Parameter optimieren</h2>
      <label for="openaiModel">OpenAI Modell</label>
      <input id="openaiModel" />
      <div class="result-grid single-row">
        <div>
          <label for="temperature">Temperature</label>
          <input id="temperature" type="number" step="0.1" min="0" max="1.5" />
        </div>
        <div>
          <label for="maxTokens">Max Tokens</label>
          <input id="maxTokens" type="number" min="50" max="2000" />
        </div>
      </div>
      <label for="systemPrompt">System Prompt</label>
      <textarea id="systemPrompt" rows="4"></textarea>
      <label for="routingPromptTemplate">Routing-Prompt (nutzt {{groups}} und {{emailText}})</label>
      <textarea id="routingPromptTemplate" rows="4"></textarea>
      <label for="replyPromptTemplate">Antwort-Prompt (nutzt {{group}}, {{emailText}} und {{knowledgeContext}})</label>
      <textarea id="replyPromptTemplate" rows="5"></textarea>
      <button id="saveAiConfigBtn">KI-Konfiguration speichern</button>
      <p id="configStatus"></p>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
