# dnsmasq-Konfiguration für das USB-Interface (usb0)
# Kopieren nach /etc/dnsmasq.d/usb.conf
# Dann: sudo systemctl restart dnsmasq

interface=usb0
bind-interfaces

dhcp-range=192.168.7.2,192.168.7.10,255.255.255.0,12h
dhcp-option=3,192.168.7.1    # Gateway = Pi
dhcp-option=6,192.168.7.1    # DNS = Pi (optional)

no-resolv
